services:
  # Postgres with PostGIS. PostGIS is needed because a land parcel's khasra
  # number has to be matched to an actual polygon on the map, and the factory
  # site's location is cross-checked against the GST registered state.
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kilowattx-postgres
    environment:
      POSTGRES_USER: kilowattx
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: kilowattx
    ports:
      # 5433 on the host, so a locally installed Postgres on 5432 is undisturbed.
      - "5433:5432"
    volumes:
      - kilowattx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilowattx -d kilowattx"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A throwaway database for integration tests: tmpfs, so it is fast and
  # nothing survives a restart. Tests must never be able to reach the
  # development database, let alone a real one.
  postgres-test:
    image: postgis/postgis:16-3.4
    container_name: kilowattx-postgres-test
    environment:
      POSTGRES_USER: kilowattx
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: kilowattx_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilowattx -d kilowattx_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kilowattx-pgdata:
